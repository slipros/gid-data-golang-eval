        original-url: github.com/slipros/gid-data-golang-eval
      gidsubtestname:
        type: module
        description: 'GID-191: subtest names in t.Run without spaces or slashes'
        original-url: github.com/slipros/gid-data-golang-eval
      gidflagmain:
