        #     - 'Job.Close'   # Type.Method
      gidoptsnaming:
        type: module
        description: 'GID-126: options type is <Entity>Options (bare Options only in app); defaults Default*'
        original-url: github.com/slipros/gid-data-golang-eval
      gidupwardimport:
        type: module
        description: 'GID-131: a child package does not import its parent'
        original-url: github.com/slipros/gid-data-golang-eval
      giderrnew:
        type: module
        description: 'GID-136: errors.New only in a package-level var, not at runtime'
        original-url: github.com/slipros/gid-data-golang-eval
      gidenumconvert:
        type: module
        description: 'GID-143: enum map conversion handles a missing key via gderror.NewUnhandledValueError'
        original-url: github.com/slipros/gid-data-golang-eval
      gidopstruct:
        type: module
        description: 'GID-210: Create structs are minimal: in model no ID/CreatedAt/UpdatedAt, in entity no UpdatedAt'
        original-url: github.com/slipros/gid-data-golang-eval
      gidenumplace:
        type: module
        description: 'GID-211: DAL-layer enums live in /dal/entity/enum'
        original-url: github.com/slipros/gid-data-golang-eval
      gidbuildsig:
        type: module
        description: 'GID-212: build functions return (string, []any, error) or (*batch.Batch, error); squirrel only in build'
        original-url: github.com/slipros/gid-data-golang-eval
      gidvalidatorshape:
        type: module
        description: 'GID-213: a validator is a struct with a Validate(ctx, req) error method'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions (validate-package types that are not validators):
        # settings:
        #   exclude:
        #     - 'SharedRules'
      gidloggernew:
        type: module
        description: 'GID-214: creating or grabbing the global logger — logrus.New()/StandardLogger(), slog.New()/Default()/SetDefault() — only in the composition root (main, internal/app)'
        original-url: github.com/slipros/gid-data-golang-eval
      gidinlineconv:
        type: module
        description: 'GID-215: inline-filling entity types in the domain layer is forbidden; conversion in convert packages'
        original-url: github.com/slipros/gid-data-golang-eval
      gideventctor:
        type: module
        description: 'GID-216: kafka consumer takes *logrus.Logger, producer does not'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions (besides //nolint:gideventctor) — constructor names:
        # settings:
        #   exclude:
        #     - 'NewAuditTrail'
      gidbansymbol:
        type: module
        description: 'GID-217: forbid specific library symbols (default gdpostgres.TQuery)'
        original-url: github.com/slipros/gid-data-golang-eval
        # The ban list is configurable; empty → default gdpostgres.TQuery:
        # settings:
        #   symbols:
        #     - pkg: gitlab.gid.team/gid-data/tech/golang/libs/postgres.git
        #       name: TQuery
        #       msg: 'use direct conn methods: Select, ScanRow, NamedStruct, Transaction'
      gidhandlershape:
        type: module
        description: 'GID-230: a gRPC handler (under server/grpc/.../handler) has Handle(ctx, ...) (..., error) and <Handler>Validator/<Handler>Service deps; the gRPC service struct exposes exported *Handler fields. HTTP handlers (server/http/handler) are out of scope — see GID-162/GID-163'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions (besides //nolint:gidhandlershape) — struct type names:
        # settings:
        #   exclude:
        #     - 'HealthCheck'
      gidfsmmap:
        type: module
        description: 'GID-231: an FSM transition map in /domain/model must be unexported'
        original-url: github.com/slipros/gid-data-golang-eval
      gidprotorequired:
        type: module
        description: 'GID-232: NewRequired on a proto3 enum field treats *_UNSPECIFIED=0 as empty — use validator.NewInRange with the allowed values'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exceptions (enum fields exempt from the rule, "Field" or "RequestType.Field"):
        # settings:
        #   exclude:
        #     - 'CreateStageRequest.Executor'
      gidenumcast:
        type: module
        description: 'GID-233: no direct cast between enum types from different packages — convert via map with gderror.NewUnhandledValueError (GID-143)'
        original-url: github.com/slipros/gid-data-golang-eval
      giderrname:
        type: module
        description: 'GID-234: errors in /domain/model are bound to their entity (ErrSnapshotNotFound), generic names (ErrNotFound) are forbidden'
        original-url: github.com/slipros/gid-data-golang-eval
        # The banned generic-name list can be replaced; point exceptions via exclude:
        # settings:
        #   names:
        #     - ErrNotFound
        #     - ErrAlreadyExists
        #   exclude:
        #     - ErrLegacy
      gidconvpure:
        type: module
        description: 'GID-235: a convert package imports only vocabulary types (model/entity/dto/client/pb) — no business layers or side-effect libraries'
        original-url: github.com/slipros/gid-data-golang-eval
        # The third-party ban list can be replaced (default: logrus):
        # settings:
        #   packages:
        #     - github.com/sirupsen/logrus
      gidloggerplace:
        type: module
        description: 'GID-251: the logger is not a field of an options struct — it is a separate constructor parameter after opts'
        original-url: github.com/slipros/gid-data-golang-eval
        # Type-name suffixes that mark an options struct (replaces the default Options/Config/Settings):
        # settings:
        #   suffixes:
        #     - 'Options'
        #     - 'Params'
      gidhttprouter:
        type: module
        description: 'GID-264: application routes reach the http server through the application router (gdhttpserver.NewApplicationRouter), registered as a separate argument of NewServer next to the system router — a router passed to NewServer bare, or nested in the system router, is served with no panic recovery, no sentry, no tracing, no metrics and no access log; GID-265: that router is given real metrics, not nil (the library substitutes a dummy that counts nothing). A service wrapper handed the metrics increment function is recognised automatically; others go in settings.application-routers'
        original-url: github.com/slipros/gid-data-golang-eval
        # A fork of the http library, and the service's own application router
        # when it takes no metrics function of its own:
        # settings:
        #   packages:
        #     - 'gitlab.gid.team/gid-data/tech/golang/libs/http.git/server'
        #   application-routers:
        #     - 'router.NewApplication'
      gidmappedfields:
        type: module
        description: 'GID-266: in a BFF (a module laid out as a service that owns no data layer) a gRPC client call carries a MappedFields option: without it a ValidationError of the callee reaches the frontend naming the fields of the foreign contract, and an empty mapping (WithMappedFields(nil)) is reported the same way — the interceptor returns early on it. Judged in /domain/service and /domain/usecase, on a call whose signature ends in opts ...grpc.CallOption; a call spreading a prepared slice is left alone'
        original-url: github.com/slipros/gid-data-golang-eval
        # An RPC whose errors need no mapping (the CALLED method, not the caller):
        # settings:
        #   exclude:
        #     - 'Ping'                        # Method | Client.Method
        #     - 'HealthClient.Check'
      gidhastest:
        type: module
        description: 'GID-263: a non-trivial exported function is exercised by a test of its own package (GID-250 keeps the test there) — the symbol must be mentioned by a _test.go the pass holds. Trivial bodies (a getter, an enum String, a one-line delegation or constructor) are never candidates, and neither are generated files, package main, /app/**, or a helper declared in a _test.go. The analyzer never reads the file system: a package whose tests the pass does not hold is left alone, so under run.tests: false the rule reports nothing at all'
        original-url: github.com/slipros/gid-data-golang-eval
        # Code whose test lives elsewhere (a black-box suite of its own) or that
        # is generated into the tree:
        # settings:
        #   exclude:
        #     - 'Segment.Rebuild'   # Method | Type.Method
        #   exclude-paths:
        #     - 'internal/generated'
      gidtestpackage:
        type: module
        description: 'GID-250: a test lives in the same package as the code under test — package <pkg>, not <pkg>_test'
        original-url: github.com/slipros/gid-data-golang-eval
        # Directories keeping a deliberate black-box suite:
        # settings:
        #   exclude-paths:
        #     - 'test/blackbox'
      gidstorageplace:
        type: module
        description: 'GID-249: a storage driver (SQL/key-value/NoSQL) is imported only by /dal/** and the composition root /app/** — a store is reached through a repository, a client is for an external API'
        original-url: github.com/slipros/gid-data-golang-eval
        # All four settings are additive — the built-in driver list stays intact:
        # settings:
        #   packages:                 # extra drivers (an in-house redis wrapper)
        #     - 'git.example.com/go-library/eredis'
        #   allow:                    # extra layers allowed to reach a driver
        #     - 'job'
        #   exclude-packages:         # imports that must not count as a driver
        #     - 'git.example.com/go-library/eredis/pkg/instrumentation'
        #   exclude-paths:            # packages skipped entirely
        #     - 'internal/legacy/cache'
      gidserviceentity:
        type: module
        description: 'GID-236: a service uses only the repository of its own entity; other entities are orchestrated in usecase'
        original-url: github.com/slipros/gid-data-golang-eval
        # Interface-name suffixes to check and point exceptions:
        # settings:
        #   suffixes:
        #     - Repository
        #   exclude:
        #     - 'Snapshot.jobRepository'  # Type.Field
        #     - 'Legacy'                  # the whole service struct
      gidserviceorch:
        type: module
        description: 'GID-260: a service does not orchestrate — two repositories or a transaction in its fields mean the composition belongs to a usecase'
        original-url: github.com/slipros/gid-data-golang-eval
        # Type-name suffixes that mark a repository dependency, and exceptions:
        # settings:
        #   suffixes:
        #     - Repository
        #     - Store
        #   exclude:
        #     - 'Integration.coreRepo'  # Struct.Field
        #     - 'LegacyWriter'          # the whole service struct
      gidbranchdispatch:
        type: module
        description: 'GID-261: a service method must not pick between two methods of the same dependency by a condition on its input — one name, two operations; split it into a method per query'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Method" | "Type.Method"):
        # settings:
        #   exclude:
        #     - 'Integration.legacyGet'
      gidmoduleimports:
        type: module
        description: 'GID-259: an application module (pkg/<module>/**) must not import the core layers besides /domain/** — a module owns its dal and takes core data through a core service; judged layers of the module: domain, dal'
        original-url: github.com/slipros/gid-data-golang-eval
        # Core layers a module may import (default ["domain"]), layers of the
        # module whose packages are judged (default ["domain", "dal"] — add
        # "server"/"client" to judge the module's transport too), and import
        # paths shared deliberately:
        # settings:
        #   allow:
        #     - domain
        #   layers:
        #     - domain
        #     - dal
        #   exclude:
        #     - 'myservice/internal/validate/i18n'
      gidwithmessage:
        type: module
        description: 'GID-237: errors.WithMessage is banned in /domain/service — return the incoming error as is, WithStack only after conversion; message context belongs to usecase'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Method" | "Type.Method"):
        # settings:
        #   exclude:
        #     - 'Legacy.Enrich'
      gidwithstack:
        type: module
        description: 'GID-248: errors.WithStack of a same-module error that already carries a stack layers a second one — return it as is; WithStack is for a static or a just-converted error'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Function" | "Type.Method"):
        # settings:
        #   exclude:
        #     - 'Legacy.Restack'
      gidcliflags:
        type: module
        description: 'GID-238/239: cli flag Name is kebab-case, env vars are UPPER_SNAKE_CASE; a flag needs Required or a default Value'
        original-url: github.com/slipros/gid-data-golang-eval
        # Flags exempt from GID-239:
        # settings:
        #   exclude:
        #     - 'debug'
      gidmodulealias:
        type: module
        description: 'GID-240: imports of shared internal entities from pkg/<module> carry a common-prefixed alias (commonservice)'
        original-url: github.com/slipros/gid-data-golang-eval
        # The alias prefix can be replaced:
        # settings:
        #   prefix: common
      giderrmapfunc:
        type: module
        description: 'GID-242: a dedicated error-mapper function (classifies its own error parameter via errors.Is/errors.As from stdlib or github.com/pkg/errors, or via a bool-predicate, AND hands back a translation of it — an error, a *status.Status, a codes.Code, an HTTP status, a message) is forbidden — map inline, at the call site; bool-predicates and wrappers are fine'
        original-url: github.com/slipros/gid-data-golang-eval
        # The classifier packages (whose Is/As calls count) can be replaced —
        # e.g. to add a project-internal errors facade that re-exports Is/As.
        # Default: ["errors", "github.com/pkg/errors"].
        # settings:
        #   packages:
        #     - errors
        #     - github.com/pkg/errors
        #     - myproject/pkg/errs
        settings:
          exclude:
            # ValidationErrorConverter is the one place gid.team gRPC services
            # register validator.Result -> gRPC status translation: it is
            # wired into gdgrpcserver.WithErrorConverters
            # (gitlab.gid.team/gid-data/tech/golang/libs/grpc), whose
            # interceptor.ErrorConverterFunc = func(error) *status.Status
            # dictates the signature — the framework calls this exact
            # function directly, so there is no call site left to fold the
            # errors.As classification into. It is the single point of
            # adaptation from validator.Result to a gRPC status; inlining it
            # at its own call site is not possible.
            - 'ValidationErrorConverter'
      giderrzeroret:
        type: module
        description: 'GID-243: on error, non-error results in a multi-value return must be nil/zero'
        original-url: github.com/slipros/gid-data-golang-eval

      gidconstexpr:
        type: module
        description: 'GID-254: a local variable initialized with a constant string expression (a concatenation of constants) must be a const — the value is folded at compile time; lone literals and numeric expressions are out of scope'
        original-url: github.com/slipros/gid-data-golang-eval
        # No settings; pinpoint exclusions via //nolint:gidconstexpr.
      gidconvpolicy:
        type: module
        description: 'GID-247: a convert function must not branch on its input to select a raw constant value — that is business policy, not mapping (move the decision to /domain/model)'
        original-url: github.com/slipros/gid-data-golang-eval
        # Converter functions exempt from the rule (a function name or Type.Method):
        # settings:
        #   exclude:
        #     - asrFormatFromSource
      giddocref:
        type: module
        description: 'GID-262: a comment must explain the code, not reference the development documentation — ARD/PRD/backlog names, requirement ids (@ФТ-11), document codes (Р-11, B-48), sections (§12), task numbers, BDD tags. _test.go is not judged (the id next to the test name is the trace the map is built from; settings.include-tests turns it on). A requirement id is not deleted but moved into the requirement map — a file of its own linked from the README (ФТ-15 → TestCreate_DuplicateTitle_AlreadyExists)'
        original-url: github.com/slipros/gid-data-golang-eval
        # patterns replace the built-in marker list, extra is appended to it
        # (a project's tracker key). Pinpoint exclusions — //nolint:giddocref:
        # settings:
        #   extra:
        #     - '\bUDMP-\d+\b'
        #   include-tests: true  # once the requirement map lives in a file of its own
      giderrtext:
        type: module
        description: 'GID-256: the text of an error (err.Error()) must not be passed into an error constructor — flattening it into a string cuts the chain and drops the stack; put the cause in the chain, and carry a stable class in a typed error with Unwrap'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Function" | "Type.Method") — a functional requirement, or
        # legacy that cannot be rewritten right now:
        # settings:
        #   exclude:
        #     - 'Client.legacyConfirm'
      gidmapout:
        type: module
        description: 'GID-257: a map received as a parameter must not be filled in — the result is missing from the signature; return the map instead. A map parameter is for data going IN'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Function" | "Type.Method"):
        # settings:
        #   exclude:
        #     - 'Resolver.legacyResolveChunk'
      giddupdep:
        type: module
        description: 'GID-268: a constructor takes the same dependency twice under two different interfaces — one entity passed under several roles overstates the collaborator count. Fix: merge the interfaces into one and take the dependency as a single parameter'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("NewModule" | "marketplace.NewModule"):
        # settings:
        #   exclude:
        #     - 'NewLegacyModule'
      giderrswallow:
        type: module
        description: 'GID-258: in /domain/**, a function that checks an error must be able to return one — logging it and moving on hides the failure from the caller; add error to the results'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Function" | "Type.Method") — soft degradation as a stated
        # functional requirement:
        # settings:
        #   exclude:
        #     - 'Resolver.degradeSilently'
      gidsentinelwrap:
        type: module
        description: 'GID-244: map a boundary error to a sentinel by reassign-then-wrap-once, not by wrapping the sentinel in a guard branch that duplicates the outer errors.Wrap'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Method" | "Type.Method"):
        # settings:
        #   exclude:
        #     - 'Repo.excludedMethod'
      gidscanrow:
        type: module
        description: 'GID-245: an epgx Select into a one-field struct reads a single column — use ScanRow with the column pointer directly'
        original-url: github.com/slipros/gid-data-golang-eval
        # Exclusions ("Method" | "Type.Method"):
        # settings:
        #   exclude:
        #     - 'Repo.excludedMethod'
      gidapproot:
        type: module
        description: 'GID-246: a struct named *Adapter is banned — an adapter only converts data between layers, and that mapping belongs in the layer''s convert subpackage (domain/service/convert, dal/repository/convert), not a standalone adapter type'
        original-url: github.com/slipros/gid-data-golang-eval
        # Escape hatch for a concrete proven case (legacy that can't be rewritten
        # now) — not a blessing for a whole layer. By directory or by type name:
        # settings:
        #   exclude-paths:
        #     - internal/legacy
        #   exclude:
        #     - LegacyAdapter
      gidclientwiring:
        type: module
        description: 'GID-255: a package in /client/** with constructors but no method declares no client — it is wiring (a connection factory), and wiring lives in the composition root /app/**'
        original-url: github.com/slipros/gid-data-golang-eval
        # No settings; pinpoint exclusions via //nolint:gidclientwiring on the package clause.

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # --- consent-api base ---
      - linters:
          - govet
        text: declaration of "err" shadows declaration
      - linters:
          - err113
        text: do not define dynamic errors, use wrapped static errors instead
      - linters:
          - gocritic
        text: 'commentedOutCode: may want to remove commented-out code'
      - path: (.+)\.go$
        text: ST1000
      # --- validate packages ---
      # goconst is off in a validation package: the rules there repeat field
      # names and error messages as literals — that is the rule set itself,
      # not duplication, and hoisting them into constants hides what is
      # being validated. The regex matches any nesting and any layer:
      # validate/, internal/validate/, server/http/validate/,
      # kafka/consumer/validate/, … To exempt another folder, copy the entry
      # and change the segment name in the path regex.
      - path: (^|/)validate/
        linters:
          - goconst
      # --- tests ---
      # dupl is off in tests: a table-driven test repeats its scaffolding by
      # design (same arrange/assert shape per case), and folding that into a
      # helper hides what each case actually asserts. The linter is here for
      # production code, where a copied block is the agent's cheapest way out
      # of reusing an existing function.
      - path: _test\.go$
        linters:
          - dupl
    paths:
      - \.pb\.go$
      - \.pb\.gw\.go$
      - consumer/http/docs
      - mock*
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - goimports # GID-203
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - \.pb\.gw\.go$
      - consumer/http/docs
      - mock*
      - third_party$
      - builtin$
      - examples$
